<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <meta
        name="description"
        content="Río Claro AI Assistant">

    <meta
        name="theme-color"
        content="#0078D4">

    <title>
        Login | Río Claro AI Assistant
    </title>

    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Styles -->

    <link
        rel="stylesheet"
        href="/static/css/styles.css">

    <style>

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #0078d4,
                    #0f172a
                );
        }

        .login-card {

            width: 100%;

            max-width: 460px;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(
                    0,
                    0,
                    0,
                    .30
                );
        }

        .login-header {

            background: white;

            text-align: center;

            padding: 30px;
        }

        .login-header i {

            font-size: 3.5rem;

            color: #0078d4;
        }

        .login-body {

            background: white;

            padding: 30px;
        }

        .login-footer {

            margin-top: 20px;

            font-size: .9rem;

            color: #64748b;
        }

        .app-version {

            margin-top: 15px;

            text-align: center;

            color: #94a3b8;

            font-size: .85rem;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <!-- HEADER -->

        <div class="login-header">

            <i class="bi bi-building"></i>

            <h2 class="mt-3">

                Río Claro

            </h2>

            <p class="mb-0">

                AI Assistant

            </p>

        </div>

        <!-- BODY -->

        <div class="login-body">

            <!-- ERROR -->

            <div
                id="loginMessage"
                class="alert alert-danger d-none">
            </div>

            <!-- USUARIO -->

            <div class="mb-3">

                <label class="form-label">

                    Usuario

                </label>

                <input
                    id="username"
                    type="text"
                    class="form-control"
                    autocomplete="username"
                    placeholder="Ingrese usuario">

            </div>

            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label">

                    Contraseña

                </label>

                <input
                    id="password"
                    type="password"
                    class="form-control"
                    autocomplete="current-password"
                    placeholder="Ingrese contraseña">

            </div>

            <!-- BOTON -->

            <button
                id="loginButton"
                type="button"
                class="btn btn-primary w-100">

                <i class="bi bi-box-arrow-in-right"></i>

                Iniciar Sesión

            </button>

            <!-- LOADER -->

            <div
                id="loginLoader"
                class="loader hidden">
            </div>

            <!-- ROLES -->

            <div class="login-footer">

                <strong>
                    Roles disponibles
                </strong>

                <ul class="mt-2">

                    <li>
                        DIRGEN
                        <small>
                            Director General
                        </small>
                    </li>

                    <li>
                        COBRANZA
                        <small>
                            Finanzas
                        </small>
                    </li>

                    <li>
                        GERENCIA
                        <small>
                            Gerencia Comercial
                        </small>
                    </li>

                    <li>
                        BODEGA
                        <small>
                            Operaciones
                        </small>
                    </li>

                    <li>
                        SISTEMAS
                        <small>
                            Administración
                        </small>
                    </li>

                </ul>

            </div>

            <!-- VERSION -->

            <div class="app-version">

                Río Claro AI Assistant v1.0

            </div>

        </div>

    </div>

    <!-- LOGIN JS -->

    <script
        src="/static/js/login.js">
    </script>

    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
